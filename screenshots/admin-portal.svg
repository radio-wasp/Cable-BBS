      <text x="10" y="42" fill="#ffffff" font-weight="bold">http://localhost:8080/hls/stream.m3u8</text>
      <rect x="406" y="22" width="56" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="434" y="38" fill="#e8e8e8" font-weight="bold" text-anchor="middle">COPY</text>

      <rect x="0" y="68" width="474" height="58" fill="#101010" stroke="#454545"/>
