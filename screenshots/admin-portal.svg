<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
  <rect width="1280" height="860" fill="#0c0c0c"/>
  <g font-family="'Courier New', Courier, Menlo, monospace" fill="#e8e8e8">
    <!-- Top Header Bar -->
    <rect x="24" y="18" width="1232" height="44" fill="#d8d8d8" stroke="#ffffff" stroke-width="2"/>
    <rect x="36" y="25" width="76" height="30" fill="#111111"/>
    <text x="48" y="45" font-size="16" font-weight="bold" fill="#f0f0f0">CH 10</text>
    <text x="126" y="45" font-size="16" font-weight="bold" fill="#0c0c0c">CABLE 10 BULLETIN // ADMIN PORTAL</text>
    <text x="1240" y="45" font-size="15" font-weight="bold" fill="#0c0c0c" text-anchor="end">ON AIR RADIO: CKUL-FM (Default Stream)</text>

    <!-- Row 1 Left: Live Broadcast Monitor -->
    <rect x="24" y="76" width="710" height="320" fill="#161616" stroke="#6e6e6e" stroke-width="2"/>
    <rect x="24" y="76" width="710" height="30" fill="#282828" stroke="#6e6e6e" stroke-width="1"/>
    <text x="36" y="96" font-size="14" font-weight="bold">[ LIVE BROADCAST MONITOR ]</text>
    <text x="722" y="96" font-size="14" font-weight="bold" text-anchor="end">ON AIR (HLS)</text>

    <!-- Embedded Mini Colour CRT Preview inside Monitor -->
    <g transform="translate(40, 114)">
      <rect x="0" y="0" width="420" height="236" fill="#0c3a80" stroke="#d8d8d8" stroke-width="2"/>
      <rect x="2" y="2" width="416" height="36" fill="#60605e"/>
      <text x="24" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff">Thu Nov 5, 2026</text>
      <text x="394" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="end">3:42 pm</text>
      <text x="44" y="64" font-size="13" font-weight="bold" fill="#d6e2f6">PRIME MINISTER PAUL MARTIN</text>
      <text x="20" y="84" font-size="13" font-weight="bold" fill="#d6e2f6">TOLD HIS CAUCUS THAT HE'S</text>
      <text x="20" y="104" font-size="13" font-weight="bold" fill="#d6e2f6">PROUD OF WHAT THE LIBERAL</text>
      <text x="20" y="124" font-size="13" font-weight="bold" fill="#d6e2f6">GOVERNMENT HAS ACCOMPLISHED IN</text>
      <text x="20" y="144" font-size="13" font-weight="bold" fill="#d6e2f6">THE LAST 17 MONTHS.</text>
      <rect x="2" y="170" width="416" height="64" fill="#2b1058"/>
      <line x1="2" y1="170" x2="418" y2="170" stroke="#7394cd" stroke-width="1.5"/>
      <text x="58" y="220" font-family="Arial Black, sans-serif" font-weight="900" font-size="48" fill="#a8b8ff">ASN</text>
      <text x="295" y="192" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="middle">YOUR MAIN</text>
      <text x="295" y="210" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="middle">ATTRACTION</text>
      <text x="295" y="226" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#dcdcf0" text-anchor="middle" letter-spacing="2">CABLE 10</text>
    </g>

    <!-- Monitor Buttons on Right of Video -->
    <g transform="translate(476, 114)" font-size="12" font-weight="bold">
      <rect x="0" y="0" width="240" height="32" fill="#d8d8d8" stroke="#ffffff"/>
      <text x="120" y="20" fill="#0c0c0c" text-anchor="middle">HLS STREAM PLAYER</text>
      <rect x="0" y="42" width="240" height="32" fill="#242424" stroke="#d8d8d8"/>
      <text x="120" y="62" fill="#e8e8e8" text-anchor="middle">FRAME PREVIEW (/preview.png)</text>
      <rect x="0" y="84" width="240" height="32" fill="#242424" stroke="#d8d8d8"/>
      <text x="120" y="104" fill="#e8e8e8" text-anchor="middle">REFRESH RSS FEEDS NOW</text>
