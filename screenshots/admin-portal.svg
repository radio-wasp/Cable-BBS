      <text x="394" y="18" fill="#e8e8e8" font-weight="bold" text-anchor="middle">SILENT / MUTE</text>

      <!-- Preset 1 (Active) -->
      <rect x="0" y="40" width="578" height="52" fill="#1d1d1d" stroke="#d8d8d8" stroke-width="2"/>
