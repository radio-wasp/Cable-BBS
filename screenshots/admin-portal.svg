      <text x="170" y="182" fill="#9e9e9e" font-size="11">RSS / ATOM FEED URL</text>
      <rect x="170" y="188" width="290" height="30" fill="#0b0b0b" stroke="#6e6e6e"/>
      <text x="178" y="208" fill="#777">https://example.com/rss.xml</text>

      <rect x="470" y="188" width="108" height="30" fill="#242424" stroke="#d8d8d8"/>
      <text x="524" y="208" fill="#e8e8e8" font-weight="bold" text-anchor="middle">+ ADD FEED</text>
