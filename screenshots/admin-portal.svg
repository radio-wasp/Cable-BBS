      <text x="12" y="80" fill="#9e9e9e" font-size="11">https://chi-master3-entry1.leanstream-hd.com:2113/CKULFM</text>
      <rect x="412" y="54" width="84" height="24" fill="#d8d8d8" stroke="#ffffff"/>
      <text x="454" y="70" fill="#0a0a0a" font-weight="bold" text-anchor="middle">TUNED IN</text>
      <rect x="502" y="54" width="64" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="534" y="70" fill="#e8e8e8" font-weight="bold" text-anchor="middle">DELETE</text>

      <!-- Preset 2 -->
      <rect x="0" y="100" width="578" height="52" fill="#101010" stroke="#454545" stroke-width="1"/>
      <text x="12" y="120" font-weight="bold">CBC Radio One Halifax</text>
      <text x="12" y="140" fill="#9e9e9e" font-size="11">https://cbcradiolive.akamaized.net/hls/live/2041030/ES_R1NS/master.m3u8</text>
      <rect x="412" y="114" width="84" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="454" y="130" fill="#e8e8e8" font-weight="bold" text-anchor="middle">TUNE IN</text>
      <rect x="502" y="114" width="64" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="534" y="130" fill="#e8e8e8" font-weight="bold" text-anchor="middle">DELETE</text>

      <!-- Add Radio Preset Form -->
      <text x="0" y="182" fill="#9e9e9e" font-size="11">STATION NAME</text>
      <rect x="0" y="188" width="160" height="30" fill="#0b0b0b" stroke="#6e6e6e"/>
