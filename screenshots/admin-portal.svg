      <text x="10" y="110" fill="#ffffff" font-weight="bold">http://localhost:8080/playlist.m3u</text>
      <rect x="406" y="90" width="56" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="434" y="106" fill="#e8e8e8" font-weight="bold" text-anchor="middle">COPY</text>

      <rect x="0" y="136" width="474" height="58" fill="#101010" stroke="#454545"/>
      <text x="10" y="154" fill="#9e9e9e" font-size="11">XMLTV EPG GUIDE</text>
      <text x="10" y="178" fill="#ffffff" font-weight="bold">http://localhost:8080/epg.xml</text>
      <rect x="406" y="158" width="56" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="434" y="174" fill="#e8e8e8" font-weight="bold" text-anchor="middle">COPY</text>

      <rect x="0" y="204" width="474" height="58" fill="#101010" stroke="#454545"/>
      <text x="10" y="222" fill="#9e9e9e" font-size="11">DIRECT MPEG-TS STREAM (.TS)</text>
      <text x="10" y="246" fill="#ffffff" font-weight="bold">http://localhost:8080/live.ts</text>
      <rect x="406" y="226" width="56" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="434" y="242" fill="#e8e8e8" font-weight="bold" text-anchor="middle">COPY</text>
    </g>

    <!-- Row 2 Left: Custom RSS News Feeds (Max 5) -->
    <rect x="24" y="412" width="606" height="285" fill="#161616" stroke="#6e6e6e" stroke-width="2"/>
