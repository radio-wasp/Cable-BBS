      <rect x="175" y="7" width="76" height="16" fill="#dadada"/>
      <text x="213" y="19" fill="#0e0e0e" font-size="10" font-weight="bold" text-anchor="middle">12 STORIES</text>
      <text x="14" y="38" fill="#9e9e9e" font-size="11">https://www.cbc.ca/webfeed/rss/rss-topstories</text>
      <rect x="502" y="12" width="64" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="534" y="28" fill="#e8e8e8" font-weight="bold" text-anchor="middle">DELETE</text>

      <!-- Feed 2 -->
      <rect x="0" y="56" width="578" height="48" fill="#1d1d1d" stroke="#d8d8d8" stroke-width="1.5"/>
      <text x="14" y="76" font-weight="bold">[x] CNN World Wire</text>
      <rect x="175" y="63" width="76" height="16" fill="#dadada"/>
      <text x="213" y="75" fill="#0e0e0e" font-size="10" font-weight="bold" text-anchor="middle">12 STORIES</text>
      <text x="14" y="94" fill="#9e9e9e" font-size="11">http://rss.cnn.com/rss/cnn_world.rss</text>
      <rect x="502" y="68" width="64" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="534" y="84" fill="#e8e8e8" font-weight="bold" text-anchor="middle">DELETE</text>

      <!-- Feed 3 -->
      <rect x="0" y="112" width="578" height="48" fill="#1d1d1d" stroke="#d8d8d8" stroke-width="1.5"/>
      <text x="14" y="132" font-weight="bold">[x] Atlantic Canada News</text>
      <rect x="215" y="119" width="76" height="16" fill="#dadada"/>
      <text x="253" y="131" fill="#0e0e0e" font-size="10" font-weight="bold" text-anchor="middle">12 STORIES</text>
      <text x="14" y="150" fill="#9e9e9e" font-size="11">https://www.cbc.ca/webfeed/rss/rss-canada-nova-scotia</text>
      <rect x="502" y="124" width="64" height="24" fill="#242424" stroke="#d8d8d8"/>
      <text x="534" y="140" fill="#e8e8e8" font-weight="bold" text-anchor="middle">DELETE</text>

      <!-- Add Feed Form -->
      <text x="0" y="182" fill="#9e9e9e" font-size="11">FEED LABEL</text>
      <rect x="0" y="188" width="160" height="30" fill="#0b0b0b" stroke="#6e6e6e"/>
