    <text x="618" y="432" font-size="14" font-weight="bold" text-anchor="end">3 / 5 FEEDS</text>

    <g transform="translate(38, 452)" font-size="12">
      <!-- Feed 1 -->
      <rect x="0" y="0" width="578" height="48" fill="#1d1d1d" stroke="#d8d8d8" stroke-width="1.5"/>
