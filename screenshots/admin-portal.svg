      <text x="170" y="182" fill="#9e9e9e" font-size="11">STREAM URL (MP3 / AAC / ICECAST)</text>
      <rect x="170" y="188" width="275" height="30" fill="#0b0b0b" stroke="#6e6e6e"/>
      <text x="178" y="208" fill="#777">https://...</text>

      <rect x="455" y="188" width="123" height="30" fill="#242424" stroke="#d8d8d8"/>
      <text x="516" y="208" fill="#e8e8e8" font-weight="bold" text-anchor="middle">+ SAVE PRESET</text>
    </g>

    <!-- Row 3: Bottom Banner & CRT Display Settings -->
    <rect x="24" y="714" width="1232" height="126" fill="#161616" stroke="#6e6e6e" stroke-width="2"/>
    <rect x="24" y="714" width="1232" height="30" fill="#282828" stroke="#6e6e6e" stroke-width="1"/>
    <text x="36" y="734" font-size="14" font-weight="bold">[ BOTTOM BANNER &amp; CRT DISPLAY SETTINGS (ASN CABLE 10 LAYOUT) ]</text>
    <rect x="1044" y="717" width="204" height="24" fill="#d8d8d8" stroke="#ffffff"/>
    <text x="1146" y="733" font-size="12" font-weight="bold" fill="#0c0c0c" text-anchor="middle">SAVE BANNER &amp; DISPLAY</text>

    <g transform="translate(38, 756)" font-size="12">
      <text x="0" y="12" fill="#9e9e9e" font-size="11">3D LEFT BANNER LOGO</text>
      <rect x="0" y="18" width="175" height="28" fill="#0b0b0b" stroke="#6e6e6e"/>
      <text x="10" y="37" font-weight="bold">ASN</text>

      <text x="195" y="12" fill="#9e9e9e" font-size="11">RIGHT BANNER LINE 1</text>
      <rect x="195" y="18" width="195" height="28" fill="#0b0b0b" stroke="#6e6e6e"/>
      <text x="205" y="37" font-weight="bold">YOUR MAIN</text>

      <text x="410" y="12" fill="#9e9e9e" font-size="11">RIGHT BANNER LINE 2</text>
      <rect x="410" y="18" width="195" height="28" fill="#0b0b0b" stroke="#6e6e6e"/>
      <text x="420" y="37" font-weight="bold">ATTRACTION</text>

      <text x="625" y="12" fill="#9e9e9e" font-size="11">RIGHT BANNER LINE 3</text>
      <rect x="625" y="18" width="195" height="28" fill="#0b0b0b" stroke="#6e6e6e"/>
      <text x="635" y="37" font-weight="bold">CABLE 10</text>

      <text x="840" y="12" fill="#9e9e9e" font-size="11">PAGE HOLD (SEC)</text>
      <rect x="840" y="18" width="160" height="28" fill="#0b0b0b" stroke="#6e6e6e"/>
      <text x="850" y="37" font-weight="bold">12</text>

      <text x="1020" y="12" fill="#9e9e9e" font-size="11">TYPEWRITER (SEC)</text>
      <rect x="1020" y="18" width="180" height="28" fill="#0b0b0b" stroke="#6e6e6e"/>
      <text x="1030" y="37" font-weight="bold">1.2</text>

      <text x="0" y="68" font-size="12">[ ] Prefix Story Text with [FEED NAME]     [x] CRT Horizontal Scanlines     [x] Analog RF Grain &amp; VHS Shimmer     [x] CRT Corner Vignette</text>
